# Add this location block inside your existing server {} block in
# /etc/nginx/sites-available/your-site.conf
#
# If you want the webhook on a subdomain instead, see the separate
# server block example at the bottom of this file.

# ── Option A: path-based (yoursite.com/webhook) ───────────────────────────────
location ~ ^/(webhook|subscribe|unsubscribe|health) {
    proxy_pass         http://127.0.0.1:5000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}


